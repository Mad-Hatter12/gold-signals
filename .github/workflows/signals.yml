name: Gold signals

on:
  schedule:
    - cron: "*/15 * * * 0-5"     # every 15 min, Sunday-Friday (UTC). GitHub may start runs a few minutes late.
  workflow_dispatch:              # "Run workflow" button for a manual refresh

permissions:
  contents: write                 # save data/history.json
  pages: write
  id-token: write

concurrency:
  group: gold-signals
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compute signals and build the page
        run: python signal_engine.py
      - name: Save signal history
        run: |
          git config user.name "gold-signals-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then git commit -m "Update signal history" && git push; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
